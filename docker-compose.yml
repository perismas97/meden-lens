services:
  postgres:
    image: postgres:16-alpine
    container_name: meden-lens-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meden_lens}
      POSTGRES_USER: ${POSTGRES_USER:-meden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meden}
    ports:
      - "5432:5432"
    volumes:
      - meden_lens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meden} -d ${POSTGRES_DB:-meden_lens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: meden-lens-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-meden_lens}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-meden}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-meden}
      MEDEN_CORS_ALLOWED_ORIGINS: ${MEDEN_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8080:8080"

volumes:
  meden_lens_postgres_data:
