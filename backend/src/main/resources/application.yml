spring:
  application:
    name: meden-lens
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meden_lens}
    username: ${SPRING_DATASOURCE_USERNAME:meden}
    password: ${SPRING_DATASOURCE_PASSWORD:meden}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

meden:
  cors:
    allowed-origins: ${MEDEN_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  scoring:
    cost-weight: 0.25
    token-weight: 0.20
    tool-weight: 0.15
    model-call-weight: 0.15
    latency-weight: 0.10
    retry-weight: 0.10
    autonomy-weight: 0.05
    insufficient-execution-token-ratio: 0.25
